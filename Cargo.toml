[package]
name = "casa1"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
name = "casa1"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5.39", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shlex = "1.3"
roxmltree = "0.20"
uuid = { version = "1.18", features = ["serde", "v4", "v5"] }
walkdir = "2.5"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
aes = "0.8"
aes-gcm = { version = "0.10", features = ["aes"] }
cbc = "0.1"
cipher = { version = "0.4", features = ["block-padding"] }
ctr = "0.9"
hmac = "0.12"
md5 = "0.7"
crossbeam-channel = "0.5"
cpal = "0.15"
minifb = "0.27"
ecdsa = { version = "0.16", features = ["der", "pem", "pkcs8"] }
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
rand = "0.8"
getrandom = "0.2"
rsa = { version = "0.9", features = ["sha2", "pem"] }
sha1 = { version = "0.10", features = ["oid"] }
hex = "0.4"
base64 = "0.22"
der = { version = "0.7", features = ["alloc", "oid"] }
spki = { version = "0.7", features = ["alloc"] }
x509-cert = "0.2"
cms = "0.2"
reqwest = { version = "0.12", features = ["blocking", "native-tls", "cookies", "json"], default-features = false }
native-tls = "0.2"
url = "2.5"
metal = "0.31"
objc = "0.2"
block = "0.1"
core-foundation = "0.10"
core-graphics = "0.24"
core-graphics-types = "0.1"
raw-window-handle = "0.6"
libloading = "0.8"
lazy_static = "1.5"
regex = "1.11"
flate2 = "1.1"
png = "0.17"
tungstenite = { version = "0.26", optional = true }
ffmpeg-next = { version = "7.0", optional = true, default-features = false }
quinn = "0.11"
rustls = "0.23"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net"] }
rustls-pemfile = "2"
rcgen = "0.13"

[workspace]
# The Windows differential-oracle reference executable is a standalone crate:
# it must build on Windows (and macOS for the workspace check) with its own
# Cargo.lock, and must not be pulled into this workspace's builds or tests.
exclude = ["windows_reference"]

[features]
# Metal is the MANDATORY host backend on macOS: the `metal`/`objc`/`block`/
# `core-foundation`/`core-graphics` dependencies below are unconditional and
# there is deliberately NO `metal` feature flag — every build includes the
# Metal backend. `vulkan`/`opengl` are guest-translation-layer features: they
# switch the guest-side translation path (vulkan-1.dll / opengl32.dll thunk
# registration), not the host backend, which is always Metal.
default = ["vulkan", "opengl"]
vulkan = []
opengl = []
moltenvk = ["vulkan"]
angle = ["opengl"]
websocket = ["tungstenite"]
ffmpeg = ["ffmpeg-next"]
proptest = []
dev-insecure-tls = []
# Forward-compat hook: `std::alloc::set_alloc_error_hook` is nightly-only.
# Declared so `unexpected_cfgs` stays enabled and this cfg remains expected.
nightly_alloc_error_hook = []

[lints.rust]
# `objc` 0.2's msg_send!/class! macros expand to code that queries
# `feature = "cargo-clippy"`; declare it so `unexpected_cfgs` stays effective
# without emitting hundreds of dependency-noise warnings.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dev-dependencies]
tempfile = "3.20"
criterion = { version = "0.5", features = ["html_reports"] }
cms = { version = "0.2", features = ["builder"] }
x509-cert = { version = "0.2", features = ["builder"] }
proptest = "1"

[profile.bench]
debug = 1

[[bench]]
name = "perf_benchmarks"
path = "benches/perf_benchmarks.rs"
harness = false

[workspace.metadata]
cargo-fuzz = true

[[bin]]
name = "casa1"
path = "src/main.rs"

[[bin]]
name = "macwin"
path = "src/bin/macwin.rs"

[[bin]]
name = "casa1-runner"
path = "src/bin/casa1-runner.rs"

[[bin]]
name = "casa1-helper"
path = "src/bin/casa1-helper.rs"

[[bin]]
name = "casa1-test-guest"
path = "src/bin/casa1-test-guest.rs"

[[bin]]
name = "casa1-oracle"
path = "src/bin/casa1-oracle.rs"
