[package]
name = "casa1"
version = "0.1.0"
edition = "2024"

[lib]
name = "casa1"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5.39", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shlex = "1.3"
roxmltree = "0.20"
uuid = { version = "1.18", features = ["serde", "v4", "v5"] }
walkdir = "2.5"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
aes = "0.8"
aes-gcm = { version = "0.10", features = ["aes"] }
cbc = "0.1"
cipher = { version = "0.4", features = ["block-padding"] }
ctr = "0.9"
hmac = "0.12"
crossbeam-channel = "0.5"
cpal = "0.15"
minifb = "0.27"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
rand = "0.8"
getrandom = "0.2"
rsa = { version = "0.9", features = ["sha2", "pem"] }
sha1 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", features = ["blocking", "native-tls", "cookies", "json"], default-features = false }
native-tls = "0.2"
url = "2.5"
metal = "0.31"
objc = "0.2"
core-graphics-types = "0.1"
raw-window-handle = "0.6"
libloading = "0.8"
lazy_static = "1.5"

[features]
default = ["metal"]
metal = []

[dev-dependencies]
tempfile = "3.20"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.bench]
debug = 1

[[bench]]
name = "perf_benchmarks"
path = "benches/perf_benchmarks.rs"
harness = false

[workspace.metadata]
cargo-fuzz = true

[[bin]]
name = "casa1"
path = "src/main.rs"

[[bin]]
name = "macwin"
path = "src/bin/macwin.rs"

[[bin]]
name = "casa1-runner"
path = "src/bin/casa1-runner.rs"

[[bin]]
name = "casa1-helper"
path = "src/bin/casa1-helper.rs"

[[bin]]
name = "casa1-test-guest"
path = "src/bin/casa1-test-guest.rs"

[[bin]]
name = "casa1-oracle"
path = "src/bin/casa1-oracle.rs"