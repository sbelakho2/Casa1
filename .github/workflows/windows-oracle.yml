name: windows-oracle

# Windows differential-oracle pipeline:
#
#   1. generate-corpus (macOS)   — the vector corpus is pure deterministic
#      host-side data, so it is generated on macOS (the Casa1 crate is not
#      built on Windows at all; only the tiny standalone reference crate is).
#   2. reference-capture (Windows) — builds windows_reference and runs the
#      REAL Windows reference executable over the corpus; uploads the
#      canonical results artifact.
#   3. compare (macOS) — computes the Casa1 RUNTIME's behavior per vector
#      over the same corpus and compares against the Windows-captured
#      results. The job FAILS on any diff: the reference executable is the
#      ONLY semantic truth (the Casa1-side model was removed entirely).
#      The compare enforces mandatory coverage for all advertised categories
#      (--required-categories): a category the runtime cannot compute, or one
#      missing from the captured results, fails the job — untested categories
#      can never pass.
#
# The checked-in golden fixture (tests/fixtures/section42) is validated by
# the regular `cargo test --tests` run (tests/section42_windows_oracle.rs).

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

# A newer push to the same ref makes older runs pure queue congestion; cancel
# them so the runner queue stays responsive (the audit flagged oracle health).
concurrency:
  group: windows-oracle-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  generate-corpus:
    name: Generate Corpus
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate the differential vector corpus
        run: cargo run -p casa1 --bin casa1-oracle -- vectors --out windows_oracle_vectors.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-oracle-vectors
          path: windows_oracle_vectors.json
          retention-days: 7

  reference-capture:
    name: Reference Capture (Windows)
    needs: generate-corpus
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: windows-oracle-vectors
      - name: Build the Windows reference executable
        run: cargo build --manifest-path windows_reference/Cargo.toml --release
      - name: Verify the reference binary embeds the application manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "windows_reference\target\release\casa1-windows-reference.exe"
          if (-not (Test-Path $exe)) { throw "reference executable not found: $exe" }
          $mt = $null
          foreach ($root in @("${env:ProgramFiles(x86)}\Windows Kits\10\bin", "$env:ProgramFiles\Windows Kits\10\bin")) {
            if ($mt) { break }
            if (-not (Test-Path $root)) { continue }
            $candidate = Get-ChildItem -Path (Join-Path $root "*\x64\mt.exe") -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($candidate) { $mt = $candidate }
          }
          if (-not $mt) { throw "mt.exe not found in the Windows 10 SDK — cannot verify the embedded manifest" }
          $manifest = Join-Path $env:RUNNER_TEMP "casa1-reference-manifest.xml"
          & $mt.FullName -nologo "-inputresource:$exe;#1" "-out:$manifest"
          if ($LASTEXITCODE -ne 0) { throw "mt.exe could not extract an embedded manifest from $exe (exit $LASTEXITCODE)" }
          $xml = Get-Content -Raw -Path $manifest
          if ($xml -notmatch "urn:schemas-microsoft-com:asm.v1") {
            throw "the extracted resource is not an assembly manifest"
          }
          if ($xml -notmatch "8e0f7a12-bfb3-4fe8-b9a5-48fd50a15a9a") {
            throw "the embedded manifest lacks the Windows 10 supportedOS GUID — GetVersionExW would be shimmed to 6.2.9200"
          }
          Write-Host "OK: $exe embeds the application manifest with the Windows 10 supportedOS GUID"
      - name: Run the reference executable on the corpus
        run: .\windows_reference\target\release\casa1-windows-reference.exe windows_oracle_vectors.json windows_oracle_reference_results.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-oracle-reference-results
          path: |
            windows_oracle_vectors.json
            windows_oracle_reference_results.json
          retention-days: 7

  compare:
    name: Compare (fail on any diff)
    needs: reference-capture
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: windows-oracle-reference-results
      - name: Compare Casa1 runtime results against the Windows reference results
        run: >-
          cargo run -p casa1 --bin casa1-oracle -- compare
          --vectors windows_oracle_vectors.json
          --results windows_oracle_reference_results.json
          --required-categories path_normalize,case_fold,file_sharing,file_lock,delete_semantics,api_set,registry,synchronization,crt_printf,thread_tls,cpu_arithmetic_flags,virtual_memory,time_clock,environment,file_metadata,directory_enumeration,version,error_domain,string_ops,section_mapping,heap

  oracle-gate:
    name: Windows Oracle
    if: always()
    needs: [generate-corpus, reference-capture, compare]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every oracle stage to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          test "${{ needs['generate-corpus'].result }}" = "success"
          test "${{ needs['reference-capture'].result }}" = "success"
          test "${{ needs['compare'].result }}" = "success"
