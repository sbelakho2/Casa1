name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check

  check:
    name: Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check compilation
        run: cargo check --all-targets
      - name: Check KNOWN-ISSUE markers carry tracking evidence
        run: ./ci/check_known_issues.sh

  clippy:
    name: Clippy (default features)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings -A future-incompatible

  clippy-all-features:
    name: Clippy (all features)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install FFmpeg development libraries
        run: |
          brew install ffmpeg@7
          # ffmpeg-sys-next 7.1.x needs the 7.x headers first; the generic
          # Homebrew prefix stays as the fallback so only one GITHUB_ENV
          # assignment exists (a later assignment would drop the 7.x path).
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg@7)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Run Clippy (all features)
        run: cargo clippy --all-targets --features angle,dev-insecure-tls,ffmpeg,ffmpeg-next,moltenvk,nightly_alloc_error_hook,opengl,proptest,tungstenite,vulkan,websocket -- -D warnings -A future-incompatible

  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The affected-test selector diffs against origin/main; a shallow
          # checkout would make that base unresolvable (and used to silently
          # select no tests).
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run affected adversarial tests with 100% changed-line coverage
        env:
          CASA1_BASE_REF: origin/main
        run: bash ci/check_tests.sh
      # The compiled-test manifest is generated inside ci/check_tests.sh (it
      # binds every declared evidence suite to a real compiled target). Upload
      # it even when the gate fails so the release job can prove and report the
      # failure instead of silently losing the evidence.
      - name: Upload compiled test/evidence manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-manifest-${{ github.sha }}
          path: ci/test-manifest.json
          if-no-files-found: warn
          retention-days: 30

  api-gate:
    name: API Completeness and Coverage Regression Gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The dev gate runs the SAME completeness gate as the release path
      # (Partial never passes; every Implemented API needs
      # Differential/Conformance coverage), then applies the regression
      # comparison against the reviewed baseline. This is deliberately not a
      # gate-none run: a CI green here must mean the release completeness gate
      # is green too.
      - name: Emit api-completeness.json (gate completeness) with commit-bound provenance
        run: |
          set -euo pipefail
          cargo run --bin casa1-oracle -- api-report --gate completeness --out api-completeness.json
          bash ci/api_report_provenance.sh api-completeness.json
      - name: Run API regression gate
        run: bash ci/check_api_regression.sh api-completeness.json --baseline ci/api-baseline.json
      - name: Upload commit-bound API completeness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-completeness-${{ github.sha }}
          path: |
            api-completeness.json
            api-completeness.json.provenance.json
          if-no-files-found: error
          retention-days: 30

  integration-tests:
    name: Integration Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run non-ignored, non-external integration tests
        env:
          RUST_TEST_THREADS: "1"
        run: cargo test --tests

  docs:
    name: Docs
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build documentation
        run: cargo doc --no-deps

  fuzz-build:
    name: Fuzz Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Build fuzz targets
        working-directory: fuzz
        run: cargo +nightly fuzz build

  fuzz-smoke:
    name: Fuzz Smoke
    runs-on: macos-latest
    needs: [fuzz-build]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Run short bounded fuzz smoke runs
        working-directory: fuzz
        run: |
          set -euo pipefail
          # Targets mirror fuzz/fuzz_targets/*.rs exactly. Each gets a short
          # bounded libFuzzer run (-runs=1000, capped by -max_total_time).
          TARGETS="dxil_parser filesystem_path http_headers http_response \
                   media_container msi_parser pe_parser registry_path \
                   spirv_parser steam_protocol url_handling video_packet \
                   winhttp_url"
          FAIL=0
          for target in $TARGETS; do
            echo ":: fuzz smoke: $target"
            if cargo +nightly fuzz run "$target" -- -runs=1000 -max_total_time=180; then
              echo "  OK: $target"
            else
              echo "::error::fuzz smoke failed for target $target"
              FAIL=1
            fi
          done
          exit "$FAIL"

  warning-count:
    name: Warning Count
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Count compiler warnings
        run: |
          LOG_FILE=$(mktemp)
          WARNING_COUNT=$(cargo check --all-targets 2>&1 | tee "$LOG_FILE" | grep "^warning:" | grep -v "future version of Rust" | grep -v "generated .* warning" | wc -l | tr -d ' ' || true)
          echo "Compiler warning count: $WARNING_COUNT"
          if [ "$WARNING_COUNT" -gt 0 ]; then
            echo "::error::$WARNING_COUNT compiler warnings detected — fix them before merging"
            grep "^warning:" "$LOG_FILE" | grep -v "future version of Rust" | grep -v "generated .* warning" | head -20 || true
            rm -f "$LOG_FILE"
            exit 1
          fi
          rm -f "$LOG_FILE"

  policy-check:
    name: Release Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify protected-main/release policy
        run: python3 ci/check_release_policy.py --root .

  # Single required status context for protected main. It is green only when
  # every gate above ran and succeeded; a skipped/failed dependency fails it.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - fmt
      - check
      - clippy
      - clippy-all-features
      - test
      - api-gate
      - integration-tests
      - docs
      - fuzz-build
      - fuzz-smoke
      - warning-count
      - policy-check
    if: always()
    steps:
      - name: Evaluate CI gate results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          if not needs:
              print("::error::CI gate has no dependencies; refusing to pass")
              sys.exit(1)
          failed = []
          for job in sorted(needs):
              result = (needs.get(job) or {}).get("result", "missing")
              print(f"{job}: {result}")
              if result != "success":
                  failed.append(job)
          if failed:
              print(f"::error::CI gate failed: {', '.join(failed)}")
              sys.exit(1)
          print(f"CI gate: all {len(needs)} required jobs passed")
          PY
