name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check

  check:
    name: Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check compilation
        run: cargo check --all-targets

  clippy:
    name: Clippy (default features)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings -A future-incompatible

  clippy-all-features:
    name: Clippy (all features)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install FFmpeg development libraries
        run: |
          brew install ffmpeg
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Run Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings -A future-incompatible

  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run unit and binary tests
        run: cargo test --lib --bins

  integration-tests:
    name: Integration Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run non-ignored, non-external integration tests
        run: cargo test --tests

  docs:
    name: Docs
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build documentation
        run: cargo doc --no-deps

  fuzz-build:
    name: Fuzz Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Build fuzz targets
        working-directory: fuzz
        run: cargo +nightly fuzz build

  warning-count:
    name: Warning Count
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Count compiler warnings
        run: |
          LOG_FILE=$(mktemp)
          WARNING_COUNT=$(cargo check --all-targets 2>&1 | tee "$LOG_FILE" | grep "^warning:" | grep -v "future version of Rust" | grep -v "generated .* warning" | wc -l | tr -d ' ' || true)
          echo "Compiler warning count: $WARNING_COUNT"
          if [ "$WARNING_COUNT" -gt 0 ]; then
            echo "::error::$WARNING_COUNT compiler warnings detected — fix them before merging"
            grep "^warning:" "$LOG_FILE" | grep -v "future version of Rust" | grep -v "generated .* warning" | head -20 || true
            rm -f "$LOG_FILE"
            exit 1
          fi
          rm -f "$LOG_FILE"
