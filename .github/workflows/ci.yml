name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run full test suite
        run: cargo test --quiet

  bench:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Run benchmarks
        run: cargo bench --quiet

  release-entitlement-audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Audit signed release artifacts
        run: bash ./ci/audit_release_entitlements.sh

  nightly-asan:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Run nightly ASAN full suite
        run: RUSTFLAGS='-Zsanitizer=address' cargo +nightly test -Zbuild-std --target aarch64-apple-darwin -- --test-threads=1

  nightly-ubsan-probe-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Probe nightly UBSAN support and run when available
        run: bash ./ci/run_nightly_ubsan_if_supported.sh

  nightly-ubsan-probe-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Probe nightly UBSAN support and run when available
        run: bash ./ci/run_nightly_ubsan_if_supported.sh