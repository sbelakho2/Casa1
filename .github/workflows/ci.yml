name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check

  check:
    name: Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check compilation
        run: cargo check --all-targets

  clippy:
    name: Clippy (default features)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings -A future-incompatible

  clippy-all-features:
    name: Clippy (all features)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install FFmpeg development libraries
        run: |
          brew install ffmpeg
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Run Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings -A future-incompatible

  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run unit and binary tests
        run: cargo test --lib --bins

  api-gate:
    name: API Completeness Gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The seeded database is EXPECTED to fail the shipping/completeness
      # gates until the oracle coverage registry is fully populated (the
      # tests assert exactly that), so this job runs the report with
      # --gate none and enforces the regression gate instead: no new Stub,
      # no new Unsupported, no Implemented -> Partial downgrade, no loss of
      # semantic coverage, no new API ambiguity.
      - name: Emit api-completeness.json (gate none)
        run: cargo run --bin casa1-oracle -- api-report --gate none --out api-completeness.json
      - name: Run API regression gate
        run: bash ci/check_api_regression.sh api-completeness.json ci/api-baseline.json

  integration-tests:
    name: Integration Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run non-ignored, non-external integration tests
        run: cargo test --tests

  docs:
    name: Docs
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build documentation
        run: cargo doc --no-deps

  fuzz-build:
    name: Fuzz Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Build fuzz targets
        working-directory: fuzz
        run: cargo +nightly fuzz build

  fuzz-smoke:
    name: Fuzz Smoke
    runs-on: macos-latest
    needs: [fuzz-build]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Run short bounded fuzz smoke runs
        working-directory: fuzz
        run: |
          set -euo pipefail
          # Targets mirror fuzz/fuzz_targets/*.rs exactly. Each gets a short
          # bounded libFuzzer run (-runs=1000, capped by -max_total_time).
          TARGETS="dxil_parser filesystem_path http_headers http_response \
                   media_container msi_parser pe_parser registry_path \
                   spirv_parser steam_protocol url_handling video_packet \
                   winhttp_url"
          FAIL=0
          for target in $TARGETS; do
            echo ":: fuzz smoke: $target"
            if cargo +nightly fuzz run "$target" -- -runs=1000 -max_total_time=180; then
              echo "  OK: $target"
            else
              echo "::error::fuzz smoke failed for target $target"
              FAIL=1
            fi
          done
          exit "$FAIL"

  warning-count:
    name: Warning Count
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Count compiler warnings
        run: |
          LOG_FILE=$(mktemp)
          WARNING_COUNT=$(cargo check --all-targets 2>&1 | tee "$LOG_FILE" | grep "^warning:" | grep -v "future version of Rust" | grep -v "generated .* warning" | wc -l | tr -d ' ' || true)
          echo "Compiler warning count: $WARNING_COUNT"
          if [ "$WARNING_COUNT" -gt 0 ]; then
            echo "::error::$WARNING_COUNT compiler warnings detected — fix them before merging"
            grep "^warning:" "$LOG_FILE" | grep -v "future version of Rust" | grep -v "generated .* warning" | head -20 || true
            rm -f "$LOG_FILE"
            exit 1
          fi
          rm -f "$LOG_FILE"
