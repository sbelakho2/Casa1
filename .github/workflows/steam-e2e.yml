name: Steam E2E

# Real Steam V1 acceptance run (S0-S13 milestones) against the actual
# packaged client, producing the evidence artifact consumed by the release
# gate (release.yml -> ci/check_release_gate.sh).
#
# IMPORTANT: this workflow MUST run on a self-hosted Apple Silicon (arm64)
# runner holding the Developer ID Application identity in its keychain.
# JIT-compiled guest code uses MAP_JIT, which the hardened runtime only
# permits when the signed casa1-runner carries
# com.apple.security.cs.allow-jit in its signature. Without a Developer ID
# identity the runner is signed ad-hoc, signed_jit_selftest is recorded as
# "fail" (the JIT self-test reports active:false — a self-test that cannot
# execute is not pass), and the release gate fails closed.
#
# The pipeline is FAIL-CLOSED end to end:
#   - ci/prepare_steam_e2e_fixture.sh hydrates the fixture (real Steam
#     updater, sha256-validated) and fails the run on any missing piece;
#   - the section41 test emits a single machine-readable verdict line
#     (STEAM_ACCEPTANCE=<JSON SteamAcceptanceResult>) that this workflow
#     parses — S0-S13 are NEVER re-derived by regex over stdout;
#   - signed_jit_selftest is "pass" only when the signed runner's
#     --jit-self-test actually ran and reported jit.active == true;
#   - signed_candidate / signed_candidate_sha256 come from the signing
#     step (sha256 of the signed binary, never empty).
#
# The schedule keeps evidence fresh; workflow_dispatch is used to re-run
# acceptance for a specific candidate commit.

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *" # UTC 03:30 daily, after the nightly run

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  steam-e2e:
    name: Steam E2E Acceptance (S0-S13)
    runs-on: [self-hosted, macos, arm64]
    steps:
      # Exact SHA: evidence must tie to the precise commit being released.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --bins

      - name: Sign binaries (Developer ID when available, else ad-hoc)
        shell: bash
        run: |
          set -euo pipefail
          # Signed JIT: casa1-runner needs the allow-jit entitlement in its
          # embedded signature for MAP_JIT guest execution. Sign it with the
          # Developer ID identity held by this self-hosted runner when one
          # exists; record the signing mode for the evidence.
          IDENTITY="$(security find-identity -v -p codesigning 2>/dev/null \
            | awk '/Developer ID Application/ {print $2; exit}')"
          if [[ -n "$IDENTITY" ]]; then
            for b in casa1 macwin casa1-helper casa1-test-guest casa1-oracle; do
              /usr/bin/codesign --force --sign "$IDENTITY" --options runtime "target/release/$b"
            done
            /usr/bin/codesign --force --sign "$IDENTITY" --options runtime \
              --entitlements ci/entitlements/casa1-runner.plist \
              target/release/casa1-runner
            echo "SIGNING_MODE=developer-id" >> "$GITHUB_ENV"
          else
            for b in casa1 macwin casa1-helper casa1-test-guest casa1-oracle; do
              /usr/bin/codesign --force --sign - "target/release/$b"
            done
            /usr/bin/codesign --force --sign - \
              --entitlements ci/entitlements/casa1-runner.plist \
              target/release/casa1-runner
            echo "SIGNING_MODE=ad-hoc" >> "$GITHUB_ENV"
          fi
          echo "Signed with: ${IDENTITY:-ad-hoc}"

      # Smoke the signed artifacts on the same machine that will E2E them:
      # fail-closed release smoke (JIT self-test, packaged-runner PE
      # execution, steam:launch profile surface, allow-jit verification).
      - name: Release smoke on signed artifacts (fail closed)
        run: CI_RELEASE=1 ./ci/check_release_smoke.sh

      # The signed JIT self-test verdict: the smoke script requires
      # active==true in release mode; this step persists the machine-
      # readable report so the evidence step can record signed_jit_selftest
      # ("pass" ONLY when the self-test actually ran and reported
      # jit.active == true).
      - name: Record JIT self-test report
        run: |
          set -euo pipefail
          target/release/casa1-runner --jit-self-test > /tmp/jit-selftest.json
          python3 -c 'import json; d = json.load(open("/tmp/jit-selftest.json")); assert "active" in d'

      # Hydrate the Steam E2E fixture: the tracked baseline is copied to a
      # fresh work dir, the real Steam updater runs (sha256-validated), and
      # the required components (client, steamwebhelper.exe, CEF payload)
      # are verified.  FAIL-CLOSED: the script exits non-zero on any missing
      # piece and its printed hydrated path is the GE the test runs.
      - name: Hydrate Steam E2E fixture (real updater, fail-closed)
        run: |
          set -euo pipefail
          STEAM_BOOTSTRAPPER_SHA256="$(shasum -a 256 ges/steam-live-run-x86/drive_c/Steam.exe | awk '{print $1}')"
          FIXTURE_ROOT="$(ci/prepare_steam_e2e_fixture.sh "$STEAM_BOOTSTRAPPER_SHA256")"
          echo "CASA1_STEAM_E2E_GE_ROOT=$FIXTURE_ROOT" >> "$GITHUB_ENV"
          echo "CASA1_STEAM_E2E_GE_NAME=steam-live-run-x86" >> "$GITHUB_ENV"

      # Steam V1 acceptance suite. section41 implements the S0-S13
      # acceptance criteria; it runs only when CASA1_STEAM_E2E=1 is set
      # (real Steam client, updater/network, CEF UI, Metal, login screen).
      # The test prints exactly one machine-readable verdict line
      # (STEAM_ACCEPTANCE=<JSON>) which the evidence step parses.
      - name: Run Steam V1 acceptance (section41)
        id: acceptance
        env:
          CASA1_STEAM_E2E: "1"
          CASA1_PE_RUNTIME_DEADLINE_SECS: "600"
        continue-on-error: true
        run: |
          cargo test --release --test section41_steam_e2e -- --ignored --nocapture \
            2>&1 | tee /tmp/section41-out.txt
          echo "TEST_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Evaluate acceptance verdict and write evidence
        id: evidence
        run: |
          set -euo pipefail
          # Layout consumed by ci/check_release_gate.sh: the evidence bundle
          # lives in e2e-evidence/steam-e2e-evidence/ (the "artifact" whose
          # content digest ties to this commit) while the top-level
          # release-evidence.json is the file the gate validates.
          mkdir -p e2e-evidence/steam-e2e-evidence
          git rev-parse HEAD > e2e-evidence/steam-e2e-evidence/commit.txt
          cp /tmp/section41-out.txt e2e-evidence/section41.txt

          # The verdict is the section41 test's STEAM_ACCEPTANCE= line — the
          # serialized SteamAcceptanceResult.  Nothing here re-implements
          # S0-S13; missing verdict = not accepted (fail closed).
          python3 - <<'PY'
          import json, os, sys

          out_path = "e2e-evidence/section41.txt"
          out = ""
          if os.path.exists(out_path):
              out = open(out_path, errors="replace").read()

          verdict = None
          for line in out.splitlines():
              if line.startswith("STEAM_ACCEPTANCE="):
                  try:
                      verdict = json.loads(line[len("STEAM_ACCEPTANCE="):])
                  except Exception as e:
                      print(f"STEAM_ACCEPTANCE line unparseable: {e}", file=sys.stderr)
                  break

          test_exit = int(os.environ.get("TEST_EXIT", "1"))
          if verdict is None:
              result = {"passed": False, "completed_stages": [],
                        "missing": [], "failures": [{"StageNotReached": "verdict_missing"}]}
              verdict = {"result": result, "run_id": "", "test_id": "",
                         "program_sha256": "", "exit_code": None, "termination": None}
              print("::warning::No STEAM_ACCEPTANCE verdict line — acceptance did not pass", file=sys.stderr)
          else:
              print("verdict parsed:", json.dumps(verdict["result"].get("passed")))

          accepted = bool(verdict["result"].get("passed"))
          verdict["test_exit"] = test_exit
          verdict["accepted"] = accepted

          json.dump({"accepted": accepted, "test_exit": test_exit,
                     "verdict": verdict,
                     "result": verdict["result"]},
                    open("e2e-evidence/steam-e2e-evidence/acceptance.json", "w"), indent=2)
          json.dump({"passed": accepted,
                     "completed_stages": verdict["result"].get("completed_stages", []),
                     "missing": verdict["result"].get("missing", []),
                     "failures": verdict["result"].get("failures", [])},
                    open("e2e-evidence/steam-e2e-evidence/milestones.json", "w"), indent=2)
          PY

          # The signed candidate: the exact signed binary that was smoke-
          # tested and E2E'd, with its sha256 — never empty.
          if [[ ! -f target/release/casa1-runner ]]; then
            echo "::error::signed candidate target/release/casa1-runner missing"
            exit 1
          fi
          cp target/release/casa1-runner e2e-evidence/signed-casa1-runner
          SIGNED_CANDIDATE_SHA256="$(shasum -a 256 e2e-evidence/signed-casa1-runner | awk '{print $1}')"
          echo "signed candidate sha256: $SIGNED_CANDIDATE_SHA256"

          # Deterministic content digest of the evidence bundle (over
          # commit.txt + acceptance.json + milestones.json; never over the
          # zip container, whose bytes vary between downloads). This value
          # becomes steam_e2e_artifact_sha256 in release-evidence.json.
          DIGEST="$(printf '%s' \
            "$(shasum -a 256 e2e-evidence/steam-e2e-evidence/commit.txt | awk '{print $1}')$(shasum -a 256 e2e-evidence/steam-e2e-evidence/acceptance.json | awk '{print $1}')$(shasum -a 256 e2e-evidence/steam-e2e-evidence/milestones.json | awk '{print $1}')" \
            | shasum -a 256 | awk '{print $1}')"
          echo "$DIGEST" > e2e-evidence/evidence.sha256

          ACCEPTED="$(python3 -c 'import json;print(json.load(open("e2e-evidence/steam-e2e-evidence/acceptance.json"))["accepted"])')"
          if [[ "$ACCEPTED" == "True" ]]; then STEAM_PASS="pass"; else STEAM_PASS="fail"; fi
          export STEAM_PASS
          export SIGNED_CANDIDATE_SHA256

          python3 - <<'PY'
          import json, os

          digest = open("e2e-evidence/evidence.sha256").read().strip()
          signing = os.environ.get("SIGNING_MODE", "ad-hoc")

          # signed_jit_selftest is "pass" ONLY when the signed runner's JIT
          # self-test actually ran and reported jit.active == true.
          jit_report = {"active": False, "fallback_reason": "no report"}
          try:
              jit_report = json.load(open("/tmp/jit-selftest.json"))
          except Exception as e:
              jit_report["fallback_reason"] = f"report unreadable: {e}"
          signed_jit_selftest = "pass" if jit_report.get("active") is True else "fail"
          json.dump(jit_report, open("e2e-evidence/jit-selftest.json", "w"), indent=2)

          evidence = {
              "schema_version": 1,
              "commit": open("e2e-evidence/steam-e2e-evidence/commit.txt").read().strip(),
              "steam_e2e_artifact": "steam-e2e-evidence",
              "steam_e2e_artifact_sha256": digest,
              "steam_e2e_acceptance": os.environ.get("STEAM_PASS", "fail"),
              "steam_e2e_milestones": os.environ.get("STEAM_PASS", "fail"),
              "signed_jit_selftest": signed_jit_selftest,
              "signing_mode": signing,
              "cargo_tests": "pass",
              "signed_candidate": "signed-casa1-runner",
              "signed_candidate_sha256": os.environ.get("SIGNED_CANDIDATE_SHA256", ""),
          }
          if not evidence["signed_candidate_sha256"]:
              raise SystemExit("signed_candidate_sha256 must never be empty")
          json.dump(evidence, open("e2e-evidence/release-evidence.json", "w"), indent=2)
          # The artifact embeds the exact evidence being validated.
          json.dump(evidence, open("e2e-evidence/steam-e2e-evidence/release-evidence.json", "w"), indent=2)
          PY

          ls -la e2e-evidence/ e2e-evidence/steam-e2e-evidence/

      - name: Upload evidence (steam-e2e-<sha>)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-e2e-${{ github.sha }}
          path: e2e-evidence/
          if-no-files-found: error
