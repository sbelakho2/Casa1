name: Steam E2E

# Real Steam V1 acceptance run (S0-S13 milestones) against the actual
# packaged client, producing the evidence artifact consumed by the release
# gate (release.yml -> ci/check_release_gate.sh).
#
# IMPORTANT: this workflow MUST run on a self-hosted Apple Silicon (arm64)
# runner holding the Developer ID Application identity in its keychain.
# JIT-compiled guest code uses MAP_JIT, which the hardened runtime only
# permits when the signed casa1-runner carries
# com.apple.security.cs.allow-jit in its signature. Without a Developer ID
# identity the runner is signed ad-hoc, signed_jit_selftest is recorded as
# "ad-hoc" (not "pass"), and the release gate fails closed.
#
# The schedule keeps evidence fresh; workflow_dispatch is used to re-run
# acceptance for a specific candidate commit.

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *" # UTC 03:30 daily, after the nightly run

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  steam-e2e:
    name: Steam E2E Acceptance (S0-S13)
    runs-on: [self-hosted, macos, arm64]
    steps:
      # Exact SHA: evidence must tie to the precise commit being released.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --bins

      - name: Sign binaries (Developer ID when available, else ad-hoc)
        shell: bash
        run: |
          set -euo pipefail
          # Signed JIT: casa1-runner needs the allow-jit entitlement in its
          # embedded signature for MAP_JIT guest execution. Sign it with the
          # Developer ID identity held by this self-hosted runner when one
          # exists; record the signing mode for the evidence.
          IDENTITY="$(security find-identity -v -p codesigning 2>/dev/null \
            | awk '/Developer ID Application/ {print $2; exit}')"
          if [[ -n "$IDENTITY" ]]; then
            for b in casa1 macwin casa1-helper casa1-test-guest casa1-oracle; do
              /usr/bin/codesign --force --sign "$IDENTITY" --options runtime "target/release/$b"
            done
            /usr/bin/codesign --force --sign "$IDENTITY" --options runtime \
              --entitlements ci/entitlements/casa1-runner.plist \
              target/release/casa1-runner
            echo "SIGNING_MODE=developer-id" >> "$GITHUB_ENV"
          else
            for b in casa1 macwin casa1-helper casa1-test-guest casa1-oracle; do
              /usr/bin/codesign --force --sign - "target/release/$b"
            done
            /usr/bin/codesign --force --sign - \
              --entitlements ci/entitlements/casa1-runner.plist \
              target/release/casa1-runner
            echo "SIGNING_MODE=ad-hoc" >> "$GITHUB_ENV"
          fi
          echo "Signed with: ${IDENTITY:-ad-hoc}"

      # Smoke the signed artifacts on the same machine that will E2E them:
      # fail-closed release smoke (JIT self-test, packaged-runner PE
      # execution, steam:launch profile surface, allow-jit verification).
      - name: Release smoke on signed artifacts (fail closed)
        run: CI_RELEASE=1 ./ci/check_release_smoke.sh

      # Steam V1 acceptance suite. section41 implements the S0-S13
      # acceptance criteria; it runs only when CASA1_STEAM_E2E=1 is set
      # (real Steam client, updater/network, CEF UI, Metal, login screen).
      - name: Run Steam V1 acceptance (section41)
        id: acceptance
        env:
          CASA1_STEAM_E2E: "1"
        continue-on-error: true
        run: |
          cargo test --test section41 -- --ignored --nocapture \
            2>&1 | tee /tmp/section41-out.txt
          echo "TEST_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Evaluate acceptance and write evidence
        id: evidence
        run: |
          set -euo pipefail
          mkdir -p e2e-evidence
          git rev-parse HEAD > e2e-evidence/commit.txt
          cp /tmp/section41-out.txt e2e-evidence/section41.txt

          # Derive the S0-S13 milestone verdicts from the section41 output
          # (mirrors src/steam_milestones.rs SteamMilestoneGroup fields).
          python3 - <<'PY'
          import json, os, re, sys

          out = ""
          out_path = "e2e-evidence/section41.txt"
          if os.path.exists(out_path):
              out = open(out_path, errors="replace").read()

          test_exit = int(os.environ.get("TEST_EXIT", "1"))

          def flag(key):
              # Accept "key": true / key:true / key = true forms.
              m = re.search(r'"' + key + r'"\s*:\s*(true|false)', out)
              if not m:
                  m = re.search(key + r'\s*[=:]\s*(true|false)', out)
              return m is not None and m.group(1) == "true"

          def count(key):
              m = re.search(r'"' + key + r'"\s*:\s*(\d+)', out)
              if not m:
                  m = re.search(key + r'\s*[=:]\s*(\d+)', out)
              return int(m.group(1)) if m else 0

          mil = {
              "bootstrap_started": flag("bootstrap_started"),
              "manifest_opened": flag("manifest_opened"),
              "manifest_verified": flag("manifest_verified"),
              "package_writability_probe": flag("package_writability_probe"),
              "client_main_started": flag("client_main_started"),
              "webhelper_processes": count("webhelper_processes"),
              "cef_browser_created": flag("cef_browser_created"),
              "cef_first_paint": flag("cef_first_paint"),
              "cef_software_paints": count("cef_software_paints"),
              "cef_accelerated_paints": count("cef_accelerated_paints"),
              "dxgi_presents": count("dxgi_presents"),
              "metal_presented_frames": count("metal_presented_frames"),
              "login_screen_visible": flag("login_screen_visible"),
          }

          # S0-S13 acceptance mapping.
          milestones = {
              "S0": mil["bootstrap_started"],
              "S1": mil["manifest_opened"],
              "S2": mil["manifest_verified"],
              "S3": mil["package_writability_probe"],
              "S4": mil["client_main_started"],
              "S5": mil["webhelper_processes"] >= 1,
              "S6": mil["cef_browser_created"],
              "S7": mil["cef_first_paint"],
              "S8": mil["cef_software_paints"] > 0,
              "S9": mil["cef_accelerated_paints"] > 0,
              "S10": mil["dxgi_presents"] > 0,
              "S11": mil["metal_presented_frames"] > 0,
              "S12": mil["login_screen_visible"],
          }
          milestones["S13"] = test_exit == 0 and all(milestones[s] for s in
                                                       ["S0","S1","S2","S3","S4","S5","S6","S7","S8","S9","S10","S11","S12"])
          accepted = milestones["S13"]

          json.dump({"accepted": accepted, "test_exit": test_exit,
                     "milestones": milestones, "milestone_flags": mil},
                    open("e2e-evidence/acceptance.json", "w"), indent=2)
          json.dump(mil, open("e2e-evidence/milestones.json", "w"), indent=2)
          print("accepted:", accepted, "| test_exit:", test_exit)
          if not accepted:
              print("::warning::Steam V1 acceptance did not pass (S0-S13 not all green)")
          PY

          # Deterministic content digest of the evidence bundle (over
          # commit.txt + acceptance.json + milestones.json; never over the
          # zip container, whose bytes vary between downloads). This value
          # becomes steam_e2e_artifact_sha256 in release-evidence.json.
          DIGEST="$(printf '%s' \
            "$(shasum -a 256 e2e-evidence/commit.txt | awk '{print $1}')$(shasum -a 256 e2e-evidence/acceptance.json | awk '{print $1}')$(shasum -a 256 e2e-evidence/milestones.json | awk '{print $1}')" \
            | shasum -a 256 | awk '{print $1}')"
          echo "$DIGEST" > e2e-evidence/evidence.sha256

          ACCEPTED="$(python3 -c 'import json;print(json.load(open("e2e-evidence/acceptance.json"))["accepted"])')"
          if [[ "$ACCEPTED" == "True" ]]; then STEAM_PASS="pass"; else STEAM_PASS="fail"; fi

          python3 - <<'PY'
          import json, os
          digest = open("e2e-evidence/evidence.sha256").read().strip()
          signing = os.environ.get("SIGNING_MODE", "ad-hoc")
          # signed_jit_selftest is only "pass" when the runner was signed
          # with the Developer ID identity (hardened runtime + allow-jit);
          # ad-hoc signing means the real signed-JIT path was not exercised.
          evidence = {
              "schema_version": 1,
              "commit": open("e2e-evidence/commit.txt").read().strip(),
              "steam_e2e_artifact": "steam-e2e-evidence",
              "steam_e2e_artifact_sha256": digest,
              "steam_e2e_acceptance": os.environ.get("STEAM_PASS", "fail"),
              "steam_e2e_milestones": os.environ.get("STEAM_PASS", "fail"),
              "signed_jit_selftest": "pass" if signing == "developer-id" else "ad-hoc",
              "signing_mode": signing,
              "cargo_tests": "pass",
              "signed_candidate": "",
              "signed_candidate_sha256": "",
          }
          json.dump(evidence, open("e2e-evidence/release-evidence.json", "w"), indent=2)
          PY

          ls -la e2e-evidence/

      - name: Upload evidence (steam-e2e-<sha>)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-e2e-${{ github.sha }}
          path: e2e-evidence/
          if-no-files-found: error
