name: Release Checklist

# SINGLE release-candidate workflow: the signed build, the Steam E2E run,
# the release smoke and the release gate all belong to the SAME workflow
# run, so evidence and signed binaries are exchanged through in-run
# artifacts (actions/download-artifact with no cross-workflow run-id/token
# gymnastics).
#
# Job topology:
#   signed-build  (self-hosted arm64)     build --release --bins + Developer
#                                         ID/ad-hoc sign, upload binaries
#   steam-e2e     (self-hosted arm64)     needs signed-build: download the
#                                         SIGNED binaries, hydrate the E2E
#                                         fixture, run section41, write and
#                                         upload the evidence bundle
#   release-smoke (self-hosted arm64)     needs signed-build: download the
#                                         SIGNED binaries and run the
#                                         fail-closed release smoke (JIT
#                                         self-test, JIT-enabled PE run)
#   audit-release-entitlements (self-hosted arm64) needs signed-build:
#                                         verify the EXISTING signatures
#   check-release-gate (macos-latest)     needs steam-e2e: download the
#                                         evidence bundle (which embeds the
#                                         signed candidate + hash) and run
#                                         ci/check_release_gate.sh
#   release-gate                          aggregates every job's result
#
# The gate consumes the evidence produced in THIS run — it never depends on
# a separately scheduled steam-e2e workflow's artifact.

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-compile:
    name: Check Compilation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --all-targets

  check-format:
    name: Check Formatting
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check

  check-clippy:
    name: Check Clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  check-tests:
    name: Check Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --tests

  check-no-insecure-tls:
    name: Check No Insecure TLS in Defaults
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify dev-insecure-tls is not in default features
        run: |
          if grep -A5 '^\[features\]' Cargo.toml | grep '^default' | grep -q 'dev-insecure-tls'; then
            echo "::error::dev-insecure-tls must not be included in default features for release"
            exit 1
          fi
          echo "✅ dev-insecure-tls is not in default features"

  check-dependency-audit:
    name: Dependency Audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run dependency audit
        run: ./ci/check_audit.sh

  check-licenses:
    name: License Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-license
        run: cargo install cargo-license
      - name: Run license check
        run: ./ci/check_licenses.sh

  check-reproducible:
    name: Reproducible Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run reproducibility check
        run: ./ci/check_reproducible.sh

  # ── Signed build (same run as E2E/smoke/gate) ─────────────────────────────
  # MUST run on the self-hosted Apple Silicon (arm64) runner holding the
  # Developer ID Application identity in its keychain: the signed binaries
  # are what the E2E and the smoke test.
  signed-build:
    name: Build and Sign Release Binaries
    runs-on: [self-hosted, macos, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --bins

      - name: Sign binaries (Developer ID when available, else ad-hoc)
        shell: bash
        run: |
          set -euo pipefail
          IDENTITY="$(security find-identity -v -p codesigning 2>/dev/null \
            | awk '/Developer ID Application/ {print $2; exit}')"
          if [[ -n "$IDENTITY" ]]; then
            for b in casa1 macwin casa1-helper casa1-test-guest casa1-oracle; do
              /usr/bin/codesign --force --sign "$IDENTITY" --options runtime "target/release/$b"
            done
            /usr/bin/codesign --force --sign "$IDENTITY" --options runtime \
              --entitlements ci/entitlements/casa1-runner.plist \
              target/release/casa1-runner
            echo "SIGNING_MODE=developer-id" >> "$GITHUB_ENV"
          else
            for b in casa1 macwin casa1-helper casa1-test-guest casa1-oracle; do
              /usr/bin/codesign --force --sign - "target/release/$b"
            done
            /usr/bin/codesign --force --sign - \
              --entitlements ci/entitlements/casa1-runner.plist \
              target/release/casa1-runner
            echo "SIGNING_MODE=ad-hoc" >> "$GITHUB_ENV"
          fi
          echo "Signed with: ${IDENTITY:-ad-hoc}"

      - name: Upload signed binaries (signed-binaries-<sha>)
        uses: actions/upload-artifact@v4
        with:
          name: signed-binaries-${{ github.sha }}
          path: |
            target/release/casa1
            target/release/macwin
            target/release/casa1-runner
            target/release/casa1-helper
            target/release/casa1-test-guest
            target/release/casa1-oracle
          if-no-files-found: error

  # ── Steam E2E acceptance on the SIGNED binaries ────────────────────────────
  steam-e2e:
    name: Steam E2E Acceptance (S0-S13, signed binaries)
    runs-on: [self-hosted, macos, arm64]
    needs: signed-build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Download signed binaries (materialized BEFORE the run)
        uses: actions/download-artifact@v4
        with:
          name: signed-binaries-${{ github.sha }}
          path: target/release

      - name: Make downloaded binaries executable
        run: chmod +x target/release/casa1 target/release/macwin target/release/casa1-runner \
          target/release/casa1-helper target/release/casa1-test-guest target/release/casa1-oracle

      - name: Hydrate Steam E2E fixture (real updater, fail-closed)
        run: |
          set -euo pipefail
          STEAM_BOOTSTRAPPER_SHA256="$(shasum -a 256 ges/steam-live-run-x86/drive_c/Steam.exe | awk '{print $1}')"
          FIXTURE_ROOT="$(ci/prepare_steam_e2e_fixture.sh "$STEAM_BOOTSTRAPPER_SHA256")"
          echo "CASA1_STEAM_E2E_GE_ROOT=$FIXTURE_ROOT" >> "$GITHUB_ENV"
          echo "CASA1_STEAM_E2E_GE_NAME=steam-live-run-x86" >> "$GITHUB_ENV"

      - name: Run Steam V1 acceptance (section41)
        id: acceptance
        env:
          CASA1_STEAM_E2E: "1"
          CASA1_PE_RUNTIME_DEADLINE_SECS: "600"
        continue-on-error: true
        run: |
          cargo test --release --test section41_steam_e2e -- --ignored --nocapture \
            2>&1 | tee /tmp/section41-out.txt
          echo "TEST_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Evaluate acceptance verdict and write evidence
        id: evidence
        run: |
          set -euo pipefail
          # Layout consumed by ci/check_release_gate.sh: the evidence bundle
          # lives in e2e-evidence/steam-e2e-evidence/ (the "artifact" whose
          # content digest ties to this commit) while the top-level
          # release-evidence.json is the file the gate validates.
          mkdir -p e2e-evidence/steam-e2e-evidence
          git rev-parse HEAD > e2e-evidence/steam-e2e-evidence/commit.txt
          cp /tmp/section41-out.txt e2e-evidence/section41.txt

          # The verdict is the section41 test's STEAM_ACCEPTANCE= line — the
          # serialized SteamAcceptanceResult.  Nothing here re-implements
          # S0-S13; missing verdict = not accepted (fail closed).
          python3 - <<'PY'
          import json, os, sys

          out_path = "e2e-evidence/section41.txt"
          out = ""
          if os.path.exists(out_path):
              out = open(out_path, errors="replace").read()

          verdict = None
          for line in out.splitlines():
              if line.startswith("STEAM_ACCEPTANCE="):
                  try:
                      verdict = json.loads(line[len("STEAM_ACCEPTANCE="):])
                  except Exception as e:
                      print(f"STEAM_ACCEPTANCE line unparseable: {e}", file=sys.stderr)
                  break

          test_exit = int(os.environ.get("TEST_EXIT", "1"))
          if verdict is None:
              result = {"passed": False, "completed_stages": [],
                        "missing": [], "failures": [{"StageNotReached": "verdict_missing"}]}
              verdict = {"result": result, "run_id": "", "test_id": "",
                         "program_sha256": "", "exit_code": None, "termination": None}
              print("::warning::No STEAM_ACCEPTANCE verdict line — acceptance did not pass", file=sys.stderr)
          else:
              print("verdict parsed:", json.dumps(verdict["result"].get("passed")))

          accepted = bool(verdict["result"].get("passed"))
          verdict["test_exit"] = test_exit
          verdict["accepted"] = accepted

          json.dump({"accepted": accepted, "test_exit": test_exit,
                     "verdict": verdict,
                     "result": verdict["result"]},
                    open("e2e-evidence/steam-e2e-evidence/acceptance.json", "w"), indent=2)
          json.dump({"passed": accepted,
                     "completed_stages": verdict["result"].get("completed_stages", []),
                     "missing": verdict["result"].get("missing", []),
                     "failures": verdict["result"].get("failures", [])},
                    open("e2e-evidence/steam-e2e-evidence/milestones.json", "w"), indent=2)
          PY

          # The signed candidate: the exact signed binary that was smoke-
          # tested and E2E'd, with its sha256 — never empty.
          if [[ ! -f target/release/casa1-runner ]]; then
            echo "::error::signed candidate target/release/casa1-runner missing"
            exit 1
          fi
          cp target/release/casa1-runner e2e-evidence/signed-casa1-runner
          SIGNED_CANDIDATE_SHA256="$(shasum -a 256 e2e-evidence/signed-casa1-runner | awk '{print $1}')"
          echo "signed candidate sha256: $SIGNED_CANDIDATE_SHA256"

          DIGEST="$(printf '%s' \
            "$(shasum -a 256 e2e-evidence/steam-e2e-evidence/commit.txt | awk '{print $1}')$(shasum -a 256 e2e-evidence/steam-e2e-evidence/acceptance.json | awk '{print $1}')$(shasum -a 256 e2e-evidence/steam-e2e-evidence/milestones.json | awk '{print $1}')" \
            | shasum -a 256 | awk '{print $1}')"
          echo "$DIGEST" > e2e-evidence/evidence.sha256

          ACCEPTED="$(python3 -c 'import json;print(json.load(open("e2e-evidence/steam-e2e-evidence/acceptance.json"))["accepted"])')"
          if [[ "$ACCEPTED" == "True" ]]; then STEAM_PASS="pass"; else STEAM_PASS="fail"; fi
          export STEAM_PASS
          export SIGNED_CANDIDATE_SHA256

          python3 - <<'PY'
          import json, os

          digest = open("e2e-evidence/evidence.sha256").read().strip()
          signing = os.environ.get("SIGNING_MODE", "ad-hoc")

          evidence = {
              "schema_version": 1,
              "commit": open("e2e-evidence/steam-e2e-evidence/commit.txt").read().strip(),
              "steam_e2e_artifact": "steam-e2e-evidence",
              "steam_e2e_artifact_sha256": digest,
              "steam_e2e_acceptance": os.environ.get("STEAM_PASS", "fail"),
              "steam_e2e_milestones": os.environ.get("STEAM_PASS", "fail"),
              # signed_jit_selftest is recorded by the release-smoke job
              # (same run): it patches this file with the real verdict.
              "signed_jit_selftest": "pending",
              "signing_mode": signing,
              "cargo_tests": "pass",
              "signed_candidate": "signed-casa1-runner",
              "signed_candidate_sha256": os.environ.get("SIGNED_CANDIDATE_SHA256", ""),
          }
          if not evidence["signed_candidate_sha256"]:
              raise SystemExit("signed_candidate_sha256 must never be empty")
          json.dump(evidence, open("e2e-evidence/release-evidence.json", "w"), indent=2)
          # The artifact embeds the exact evidence being validated.
          json.dump(evidence, open("e2e-evidence/steam-e2e-evidence/release-evidence.json", "w"), indent=2)
          PY

          ls -la e2e-evidence/ e2e-evidence/steam-e2e-evidence/

      - name: Upload evidence (steam-e2e-<sha>)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-e2e-${{ github.sha }}
          path: e2e-evidence/
          if-no-files-found: error

  # ── Release smoke on the SIGNED binaries (same run) ────────────────────────
  release-smoke-tests:
    name: Release Smoke Tests (signed binaries)
    runs-on: [self-hosted, macos, arm64]
    needs: signed-build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Download signed binaries (materialized BEFORE the smoke)
        uses: actions/download-artifact@v4
        with:
          name: signed-binaries-${{ github.sha }}
          path: target/release

      - name: Make downloaded binaries executable
        run: chmod +x target/release/casa1 target/release/macwin target/release/casa1-runner \
          target/release/casa1-helper target/release/casa1-test-guest target/release/casa1-oracle

      # CI_RELEASE=1: missing binaries fail (never silently rebuilt) and the
      # smoke suite requires the signed JIT self-test (active == true) plus
      # the JIT-enabled packaged-runner PE execution (jit.active == true &&
      # blocks_compiled > 0).
      - name: Run release smoke tests (fail closed)
        run: CI_RELEASE=1 ./ci/check_release_smoke.sh

      - name: Persist JIT self-test report
        run: |
          set -euo pipefail
          mkdir -p jit-selftest
          target/release/casa1-runner --jit-self-test > jit-selftest/jit-selftest.json
          python3 -c 'import json; d = json.load(open("jit-selftest/jit-selftest.json")); assert "active" in d'

      - name: Upload JIT self-test report (jit-selftest-report-<sha>)
        uses: actions/upload-artifact@v4
        with:
          name: jit-selftest-report-${{ github.sha }}
          path: jit-selftest/
          if-no-files-found: error

  # ── Entitlement audit on the SIGNED binaries (same run) ────────────────────
  audit-release-entitlements:
    name: Audit Release Entitlements
    runs-on: [self-hosted, macos, arm64]
    needs: signed-build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Download signed binaries
        uses: actions/download-artifact@v4
        with:
          name: signed-binaries-${{ github.sha }}
          path: target/release
      - name: Verify existing signatures and entitlements (never re-signs)
        run: ./ci/audit_release_entitlements.sh --verify-existing-signatures

  # ── Release evidence gate (same run) ───────────────────────────────────────
  check-release-gate:
    name: Release Evidence Gate
    runs-on: macos-latest
    needs:
      - steam-e2e
      - release-smoke-tests
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Download Steam E2E evidence artifact (fails closed if absent)
        uses: actions/download-artifact@v4
        with:
          name: steam-e2e-${{ github.sha }}
          path: e2e-evidence
      # The release-smoke job's JIT self-test verdict must reach the
      # evidence: the smoke job uploads its report, and this job folds it
      # into release-evidence.json before the gate runs.
      - name: Download JIT self-test report from the smoke job
        uses: actions/download-artifact@v4
        with:
          name: jit-selftest-report-${{ github.sha }}
          path: jit-selftest
        continue-on-error: true
      - name: Fold JIT self-test verdict into the evidence
        run: |
          set -euo pipefail
          if [[ -f jit-selftest/jit-selftest.json ]]; then
            ACTIVE="$(python3 -c 'import json;print(json.load(open("jit-selftest/jit-selftest.json")).get("active", False))')"
            if [[ "$ACTIVE" == "True" ]]; then
              python3 - <<'PY'
              import json
              for p in ("e2e-evidence/release-evidence.json",
                        "e2e-evidence/steam-e2e-evidence/release-evidence.json"):
                  d = json.load(open(p))
                  d["signed_jit_selftest"] = "pass"
                  json.dump(d, open(p, "w"), indent=2)
              PY
            else
              python3 - <<'PY'
              import json
              for p in ("e2e-evidence/release-evidence.json",
                        "e2e-evidence/steam-e2e-evidence/release-evidence.json"):
                  d = json.load(open(p))
                  d["signed_jit_selftest"] = "fail"
                  json.dump(d, open(p, "w"), indent=2)
              PY
              echo "::warning::signed_jit_selftest is fail — the signed runner's JIT self-test did not report active"
            fi
            cp jit-selftest/jit-selftest.json e2e-evidence/jit-selftest.json
          else
            echo "::warning::JIT self-test report missing — signed_jit_selftest stays pending"
          fi
      # Evidence model: the gate verifies release-evidence.json (commit ==
      # HEAD, all required fields "pass", Steam E2E artifact digest ties to
      # this commit, signed candidate hash matches the artifact tested).
      - name: Verify release evidence
        run: |
          RELEASE_EVIDENCE_FILE="$GITHUB_WORKSPACE/e2e-evidence/release-evidence.json" \
          RELEASE_EVIDENCE_DIR="$GITHUB_WORKSPACE/e2e-evidence" \
          ./ci/check_release_gate.sh

  release-gate:
    name: Release Gate
    runs-on: macos-latest
    needs:
      - check-compile
      - check-format
      - check-clippy
      - check-tests
      - check-no-insecure-tls
      - check-dependency-audit
      - check-licenses
      - check-reproducible
      - signed-build
      - steam-e2e
      - release-smoke-tests
      - audit-release-entitlements
      - check-release-gate
    if: always()
    steps:
      - name: Evaluate release gate results
        run: |
          RESULTS=""
          FAIL=0

          for job in check-compile check-format check-clippy check-tests \
                     check-no-insecure-tls check-dependency-audit \
                     check-licenses check-reproducible signed-build steam-e2e \
                     release-smoke-tests audit-release-entitlements \
                     check-release-gate; do
            STATUS=""
            case "$job" in
              check-compile)           STATUS="${{ needs.check-compile.result }}" ;;
              check-format)            STATUS="${{ needs.check-format.result }}" ;;
              check-clippy)            STATUS="${{ needs.check-clippy.result }}" ;;
              check-tests)             STATUS="${{ needs.check-tests.result }}" ;;
              check-no-insecure-tls)   STATUS="${{ needs.check-no-insecure-tls.result }}" ;;
              check-dependency-audit)  STATUS="${{ needs.check-dependency-audit.result }}" ;;
              check-licenses)          STATUS="${{ needs.check-licenses.result }}" ;;
              check-reproducible)      STATUS="${{ needs.check-reproducible.result }}" ;;
              signed-build)            STATUS="${{ needs.signed-build.result }}" ;;
              steam-e2e)               STATUS="${{ needs.steam-e2e.result }}" ;;
              release-smoke-tests)     STATUS="${{ needs.release-smoke-tests.result }}" ;;
              audit-release-entitlements) STATUS="${{ needs.audit-release-entitlements.result }}" ;;
              check-release-gate)      STATUS="${{ needs.check-release-gate.result }}" ;;
            esac

            if [ "$STATUS" = "success" ]; then
              RESULTS="$RESULTS\n✅ $job: PASSED"
            else
              RESULTS="$RESULTS\n❌ $job: FAILED ($STATUS)"
              FAIL=1
            fi
          done

          echo -e "$RESULTS"
          echo ""

          if [ "$FAIL" -eq 1 ]; then
            echo "::error::Release gate FAILED — evidence is missing or a check did not pass"
            echo "::error::The gate fails closed: Steam E2E evidence for this exact SHA,"
            echo "::error::the signed JIT self-test, and the evidence checks are all required."
            exit 1
          else
            echo "🎉 All release gate checks PASSED"
          fi
