name: Nightly

on:
  schedule:
    - cron: "0 2 * * *" # UTC 02:00 daily
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run all integration tests
        env:
          RUST_TEST_THREADS: "1"
        run: cargo test --tests

  all-features-test:
    name: All Features Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install FFmpeg system dependencies (all-features build needs them)
        run: |
          set -euo pipefail
          brew install ffmpeg@7
          # One assignment only: a later PKG_CONFIG_PATH write would drop the
          # ffmpeg@7 path that ffmpeg-sys-next 7.1.x must see first.
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg@7)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "FFMPEG_DIR=$(brew --prefix ffmpeg@7)" >> "$GITHUB_ENV"
          # ffmpeg-sys-next's probe TU includes <libavcodec/avcodec.h> but then
          # references LIBAVCODEC_VERSION_* macros, which live behind a version
          # include guard; force-include them for the probe compile.
          echo "CFLAGS=-I$(brew --prefix ffmpeg@7)/include -include libavcodec/version_major.h -include libavcodec/version.h" >> "$GITHUB_ENV"
          # rust-cache does not key on FFMPEG_DIR, so drop stale build-script
          # output that may point at a different FFmpeg install.
          rm -rf target/debug/build/ffmpeg-sys-next-* target/debug/build/ffmpeg-next-*
          cargo clean -p ffmpeg-sys-next -p ffmpeg-next || true
          # ffmpeg-next discovers the system libraries through pkg-config.
          # Homebrew does not put its lib/pkgconfig on the default search path
          # for every runner image, so make it explicit for this step and for
          # every later step (this is the same environment the stable
          # clippy-all-features job uses).

          pkg-config --modversion libavcodec
          # ffmpeg-sys-next's FFI is generated from these headers, so the
          # installed major IS the ABI pin. FFmpeg 7.1 => libav* major 61;
          # refuse to run the all-features suite against any other major.
          for lib in libavcodec libavformat; do
            major="$(pkg-config --modversion "$lib" | cut -d. -f1)"
            if [ "$major" != "61" ]; then
              echo "::error::$lib major $major != 61; expected the pinned FFmpeg 7.1 ABI"
              exit 1
            fi
          done
      - name: Test with all features (cargo-invoking meta tests skipped)
        run: |
          set -euo pipefail
          SKIPS=()
          while IFS= read -r name; do
            [[ -z "$name" ]] && continue
            SKIPS+=(--skip "$name")
          done < ci/meta-tests.txt
          if ((${#SKIPS[@]})); then
            cargo test --all-features -- "${SKIPS[@]}"
          else
            cargo test --all-features --
          fi

  no-default-features:
    name: No Default Features
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check with no default features
        run: cargo check --no-default-features

  check-metal:
    name: Check Metal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check all targets (Metal is mandatory, no feature flag)
        run: cargo check --all-targets

  check-vulkan:
    name: Check Vulkan
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check with vulkan feature
        run: cargo check --all-targets --features vulkan

  check-opengl:
    name: Check OpenGL
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check with opengl feature
        run: cargo check --all-targets --features opengl

  check-websocket:
    name: Check WebSocket
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check with websocket feature
        run: cargo check --all-targets --features websocket

  check-ffmpeg:
    name: Check FFmpeg ${{ matrix.ffmpeg }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Crate minor tracks FFmpeg minor; 7.1 is the only supported ABI.
          # Introduce a new FFmpeg major by adding a row here AND bumping the
          # pinned ffmpeg-next line in Cargo.toml.
          - ffmpeg: "7.1"
            formula: "ffmpeg@7"
            pkg_config_major: "61"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install FFmpeg ${{ matrix.ffmpeg }} development libraries
        run: |
          set -euo pipefail
          brew install ${{ matrix.formula }}
          echo "PKG_CONFIG_PATH=$(brew --prefix ${{ matrix.formula }})/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "FFMPEG_DIR=$(brew --prefix ${{ matrix.formula }})" >> "$GITHUB_ENV"
          rm -rf target/debug/build/ffmpeg-sys-next-* target/debug/build/ffmpeg-next-*
          cargo clean -p ffmpeg-sys-next -p ffmpeg-next || true
      - name: Verify FFmpeg ABI major
        run: |
          set -euo pipefail
          for lib in libavcodec libavformat; do
            major="$(pkg-config --modversion "$lib" | cut -d. -f1)"
            if [ "$major" != "${{ matrix.pkg_config_major }}" ]; then
              echo "::error::$lib major $major != ${{ matrix.pkg_config_major }}; FFmpeg ${{ matrix.ffmpeg }} ABI pin is not satisfied"
              exit 1
            fi
          done
      - name: Check FFmpeg-backed library
        run: cargo check --lib --features ffmpeg

  nightly-sanitizer:
    name: Nightly Sanitizer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Run nightly lib/bins tests (cargo-invoking meta tests skipped)
        run: |
          set -euo pipefail
          SKIPS=()
          while IFS= read -r name; do
            [[ -z "$name" ]] && continue
            SKIPS+=(--skip "$name")
          done < ci/meta-tests.txt
          if ((${#SKIPS[@]})); then
            cargo +nightly test --lib --bins -- "${SKIPS[@]}"
          else
            cargo +nightly test --lib --bins --
          fi
      - name: Test nightly UBSAN if supported
        run: bash ci/run_nightly_ubsan_if_supported.sh

  fuzz-build:
    name: Fuzz Build (nightly)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      # cargo-fuzz does not accept --manifest-path; it discovers
      # fuzz/Cargo.toml from the working directory.
      - name: Build fuzz targets with nightly
        working-directory: fuzz
        run: cargo +nightly fuzz build
